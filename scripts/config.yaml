# ============================================
# UAV Inventory Management - Configuration
# ============================================

warehouse:
  bounds:
    x_min: -10.0
    x_max: 9.0
    y_min: -8.0
    y_max: 10.0
    z_min: 0.0
    z_max: 5.5

navigation:
  takeoff_height: 1.0
  flight_speed: 0.4
  waypoint_tolerance: 0.25
  waypoint_timeout: 120
  
  # Путь сканирования (строго следуем маршруту)
  scanning_waypoints:
    - {x: 0, y: 3.3, z: 0.8, pause: 1.0, description: "Ground level start"}
    - {x: 1.5, y: 3.3, z: 0.8, pause: 2.0, description: "ITEM_001"}
    - {x: -2.4, y: 3.4, z: 0.8, pause: 2.0, description: "ITEM_002"}
    - {x: 2.6, y: 3.5, z: 0.8, pause: 2.0, description: "ITEM_003"}
    - {x: -3.5, y: 3.3, z: 0.8, pause: 2.0, description: "ITEM_004"}
    - {x: -4.7, y: 3.4, z: 0.8, pause: 2.0, description: "ITEM_005"}
    - {x: -6.0, y: 3.3, z: 0.8, pause: 2.0, description: "ITEM_006"}
    
    # 1st level
    - {x: 0, y: 3.3, z: 1.65, pause: 1.0, description: "Move to 1st level"}
    - {x: -3.2, y: 3.3, z: 2.3, pause: 2.0, description: "ITEM_007"}
    - {x: 0.33, y: 3.3, z: 1.65, pause: 2.0, description: "ITEM_008"}
    - {x: 0.33, y: 3.3, z: 2.31, pause: 2.0, description: "ITEM_009"}
    - {x: 2.64, y: 3.3, z: 1.65, pause: 2.0, description: "ITEM_010"}
    - {x: -2.3, y: 2.9, z: 2.3, pause: 2.0, description: "ITEM_011"}
    - {x: -4.7, y: 3.4, z: 2.35, pause: 2.0, description: "ITEM_012"}
    - {x: -6.0, y: 3.3, z: 2.35, pause: 2.0, description: "ITEM_013"}
    - {x: -0.8, y: 3.3, z: 2.3, pause: 2.0, description: "ITEM_014"}
    
    # 2nd level
    - {x: 0, y: 3.3, z: 3.3, pause: 1.0, description: "Move to 2nd level"}
    - {x: -2.2, y: 3.3, z: 3.27, pause: 2.0, description: "ITEM_015"}
    - {x: -4.7, y: 3.3, z: 3.27, pause: 2.0, description: "ITEM_016"}
    - {x: -5.9, y: 3.3, z: 3.27, pause: 2.0, description: "ITEM_017"}
    - {x: -3.2, y: 3.3, z: 3.97, pause: 2.0, description: "ITEM_018"}
    - {x: 2.57, y: 3.3, z: 3.97, pause: 2.0, description: "ITEM_019"}
    - {x: -0.8, y: 3.3, z: 3.97, pause: 2.0, description: "ITEM_020"}
    
    # Shelf B - ground level
    - {x: 0, y: -1.5, z: 0.8, pause: 1.0, description: "Move to Shelf B ground"}
    - {x: 1.48, y: -1.5, z: 0.8, pause: 2.0, description: "ITEM_021"}
    - {x: 2.9, y: -1.5, z: 0.8, pause: 2.0, description: "ITEM_022"}
    
    # Shelf B - 1st level
    - {x: 0, y: -1.5, z: 1.65, pause: 1.0, description: "Move to Shelf B 1st level"}
    - {x: 1.6, y: -1.5, z: 2.3, pause: 2.0, description: "ITEM_023"}
    - {x: 2.9, y: -1.5, z: 2.3, pause: 2.0, description: "ITEM_024"}
    
    # Shelf B - 2nd level
    - {x: 0, y: -1.5, z: 3.3, pause: 1.0, description: "Move to Shelf B 2nd level"}
    - {x: 1.6, y: -1.5, z: 3.97, pause: 2.0, description: "ITEM_025"}
    - {x: 2.9, y: -1.5, z: 3.97, pause: 2.0, description: "ITEM_026"}
    
    - {x: 0, y: 0, z: 1.0, pause: 2.0, description: "Return to home"}

obstacle_avoidance:
  # VFH+ параметры
  danger_distance: 1.0  # мет��ы
  warning_distance: 1.5  # метры
  front_sector_degrees: 60  # угол впереди
  
  # Уклонение
  evade_distance: 1.5  # как далеко уклониться
  evade_height_offset: 0.3  # поднять при уклонении
  
qr_detection:
  # OpenCV параметры
  min_contour_area: 100
  detection_timeout: 8.0
  frame_width: 640
  frame_height: 480
  
  # Confidence threshold для QR
  qr_confidence_threshold: 0.7

